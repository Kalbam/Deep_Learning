name: Publicar libro

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Jupyter Book
        run: pip install "jupyter-book<2" sphinx-proof

      - name: Construir el libro
        run: jupyter-book build .

      - name: Preparar archivos para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

      - name: Publicar el libro
        id: deploy
        uses: actions/deploy-pages@v4
